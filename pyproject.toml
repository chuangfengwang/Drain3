[tool.poetry]
name = "drain3"
version = "0.9.12"
description = "Persistent & streaming log template miner"
authors = ["IBM Research Haifa <david.ohana@ibm.com>"]
maintainers = ["Yihao Chen(Superskyyy) <yihaochen@apache.org>"]
readme = "README.md"
license = "MIT"
keywords=['drain', 'log', 'parser', 'IBM', 'template', 'logs', 'miner']

classifiers=[
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    'Topic :: System :: Monitoring',
    "Topic :: Software Development :: Libraries",
]

packages = [
    { include = "drain3" },
]

exclude = ['tests', 'examples']

[tool.poetry.build]
generate-setup-file = true


[tool.poetry.dependencies]
python = ">=3.6,<4.0"
jsonpickle = [
    { version = ">=1.5.1,<3", python = "<3.7" },
    { version = ">=1.5.1", python = ">=3.7" },
]
cachetools = [
    { version = ">=4.0.0,<5", python = "<3.7" },
    { version = ">=4.0.0", python = ">=3.7" },
]
redis = [
    { version = ">=3.5.3,<5", python = "<3.7", optional = true },
    { version = ">=3.5.3", python = ">=3.7", optional = true },
]
kafka-python = [
    { version = ">=2.0.1", python = "<3.7", optional = true },
    { version = ">=2.0.1", python = ">=3.7", optional = true },
]

[tool.poetry.extras]
all=[
    'redis',
    'kafka-python',
]
kafka= [
    'kafka-python',
]
redis=[
    'redis',
]

[tool.poetry.group.dev.dependencies]
# The typing tools are only needed on the versions we type-check with.
# mypy/types-redis pull cryptography -> cffi, which needs a wheel for the running
# interpreter, so keep them off the oldest interpreters.
mypy = { version = "*", python = ">=3.10" }
types-cachetools = { version = "*", python = ">=3.9" }
types-redis = { version = "*", python = ">=3.10" }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
